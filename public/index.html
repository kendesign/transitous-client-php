<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Busverbindung von A nach B</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root{--g:#1c7f4e;--ink:#1d232b;--mute:#5b6471;--line:#dfe3e8}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);display:grid;grid-template-columns:380px 1fr;height:100vh}
  aside{padding:20px 20px 12px;overflow:auto;border-right:1px solid var(--line)}
  h1{font-size:20px;margin:0 0 18px;font-weight:600}
  label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
  .feld{position:relative}
  input[type=text],input[type=datetime-local]{width:100%;height:44px;border:1px solid var(--line);border-radius:999px;padding:0 16px;font:inherit}
  input:focus{outline:2px solid var(--g);outline-offset:1px}
  .vorschlaege{position:absolute;left:0;right:0;top:48px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.1);z-index:1000;overflow:hidden}
  .vorschlaege button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 16px;font:inherit;cursor:pointer}
  .vorschlaege button:hover,.vorschlaege button:focus{background:#eef6f1}
  .vorschlaege small{color:var(--mute)}
  .knopf{margin-top:18px;height:44px;padding:0 26px;border:0;border-radius:999px;background:var(--g);color:#fff;font:600 15px inherit;font-family:inherit;cursor:pointer}
  .knopf:hover{background:#176a41}.knopf[disabled]{opacity:.5;cursor:default}
  .hinweis{color:var(--mute);font-size:13px;margin:10px 0 0}
  .fehler{color:#b30410;margin-top:12px}
  .ergebnis{margin:14px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:#fff;width:100%;text-align:left;font:inherit;display:block}
  .ergebnis.an{border-color:var(--g);box-shadow:0 0 0 1px var(--g)}
  .ergebnis b{font-size:16px}
  .abschnitte{margin:8px 0 0;padding:0;list-style:none;font-size:13px;color:var(--mute)}
  .abschnitte li{padding:2px 0}
  .linie{display:inline-block;min-width:34px;text-align:center;padding:0 8px;border-radius:999px;background:var(--g);color:#fff;font-weight:600;font-size:12px;margin-right:6px}
  .linie.zu{background:#8b95a3}
  footer{margin:22px 0 8px;font-size:12px;color:var(--mute)}
  #karte{height:100%;min-height:300px}
  @media(max-width:760px){body{grid-template-columns:1fr;grid-template-rows:auto 55vh;height:auto}aside{border-right:0}}
</style>
</head>
<body>
<aside>
  <h1>Busverbindung von A nach B</h1>
  <div class="feld"><label for="a">Start (A)</label><input id="a" type="text" autocomplete="off" placeholder="Adresse oder Haltestelle"><div class="vorschlaege" id="va" hidden></div></div>
  <div class="feld"><label for="b">Ziel (B)</label><input id="b" type="text" autocomplete="off" placeholder="Adresse oder Haltestelle"><div class="vorschlaege" id="vb" hidden></div></div>
  <label for="zeit">Abfahrt (leer = jetzt)</label><input id="zeit" type="datetime-local">
  <button class="knopf" id="los" disabled>Verbindung berechnen</button>
  <p class="hinweis">Tipp: Du kannst Start und Ziel auch direkt auf der Karte anklicken.</p>
  <div class="fehler" id="fehler" role="alert"></div>
  <div id="liste" aria-live="polite"></div>
  <footer>Routing-Daten: <a href="https://transitous.org">Transitous</a> · Karte: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende</footer>
</aside>
<div id="karte"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
  var API = 'api.php', karte, pt = {a: null, b: null}, marker = {a: null, b: null}, linien = L.layerGroup(), ergebnisse = [];
  var el = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
  function api(q) { return fetch(API + '?' + q).then(function (r) { return r.json(); }); }
  function uhr(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'}); }

  function decode(str, prec) {            // encoded polyline, precision 5 to 7
    var f = Math.pow(10, prec), i = 0, lat = 0, lon = 0, out = [];
    while (i < str.length) {
      var b, s = 0, r = 0;
      do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << s; s += 5; } while (b >= 32);
      lat += (r & 1) ? ~(r >> 1) : (r >> 1); s = 0; r = 0;
      do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << s; s += 5; } while (b >= 32);
      lon += (r & 1) ? ~(r >> 1) : (r >> 1);
      out.push([lat / f, lon / f]);
    }
    return out;
  }

  function setze(w, ort, text) {
    pt[w] = ort; if (text != null) el(w).value = text;
    if (marker[w]) karte.removeLayer(marker[w]);
    marker[w] = L.marker([ort.lat, ort.lon], {title: w.toUpperCase()}).addTo(karte).bindTooltip(w.toUpperCase(), {permanent: true, direction: 'top', offset: [-15, -8]});
    el('los').disabled = !(pt.a && pt.b);
  }

  function vorschlaege(w) {
    var inp = el(w), box = el('v' + w), t;
    inp.addEventListener('input', function () {
      pt[w] = null; el('los').disabled = true; clearTimeout(t);
      var q = inp.value.trim(); if (q.length < 3) { box.hidden = true; return; }
      t = setTimeout(function () {
        api('a=geocode&q=' + encodeURIComponent(q)).then(function (d) {
          box.innerHTML = '';
          (d.places || []).forEach(function (p) {
            var bt = document.createElement('button'); bt.type = 'button';
            bt.innerHTML = esc(p.name) + (p.place ? '<br><small>' + esc(p.place) + '</small>' : '');
            bt.onclick = function () { box.hidden = true; setze(w, p, p.name); karte.setView([p.lat, p.lon], Math.max(karte.getZoom(), 13)); };
            box.appendChild(bt);
          });
          box.hidden = !box.children.length;
        }).catch(function () { box.hidden = true; });
      }, 350);
    });
    inp.addEventListener('blur', function () { setTimeout(function () { box.hidden = true; }, 200); });
  }

  function zeichne(it) {
    linien.clearLayers(); var alle = [];
    it.legs.forEach(function (lg) {
      if (!lg.points) return; var pts = decode(lg.points, lg.precision || 6); alle = alle.concat(pts);
      L.polyline(pts, lg.mode === 'WALK' ? {color: '#8b95a3', weight: 4, dashArray: '2 8'} : {color: '#1c7f4e', weight: 5}).addTo(linien);
    });
    if (alle.length) karte.fitBounds(L.latLngBounds(alle), {padding: [40, 40]});
  }

  function zeige(liste) {
    var box = el('liste'); box.innerHTML = ''; ergebnisse = liste;
    if (!liste.length) { box.innerHTML = '<p class="hinweis">Keine Verbindung gefunden.</p>'; return; }
    liste.forEach(function (it, i) {
      var bt = document.createElement('button'); bt.type = 'button'; bt.className = 'ergebnis' + (i === 0 ? ' an' : '');
      var h = '<b>' + uhr(it.start) + ' bis ' + uhr(it.end) + '</b> · ' + it.minutes + ' Min.' + (it.transfers ? ' · ' + it.transfers + ' Umstieg' + (it.transfers > 1 ? 'e' : '') : ' · direkt') + '<ul class="abschnitte">';
      it.legs.forEach(function (lg) {
        h += lg.mode === 'WALK' ? '<li><span class="linie zu">zu Fuß</span>' + uhr(lg.start) + '</li>'
          : '<li><span class="linie">' + esc(lg.line || lg.mode) + '</span>' + uhr(lg.start) + ' ' + esc(lg.from) + ' › ' + esc(lg.to) + '</li>';
      });
      bt.innerHTML = h + '</ul>';
      bt.onclick = function () { [].forEach.call(box.querySelectorAll('.ergebnis'), function (x) { x.classList.remove('an'); }); bt.classList.add('an'); zeichne(it); };
      box.appendChild(bt);
    });
    zeichne(liste[0]);
  }

  function berechnen() {
    el('fehler').textContent = ''; el('liste').innerHTML = ''; el('los').disabled = true;
    var q = 'a=plan&from=' + pt.a.lat + ',' + pt.a.lon + '&to=' + pt.b.lat + ',' + pt.b.lon + (el('zeit').value ? '&time=' + encodeURIComponent(new Date(el('zeit').value).toISOString()) : '');
    api(q).then(function (d) {
      if (d.error) el('fehler').textContent = 'Das hat gerade nicht geklappt. Bitte später noch einmal versuchen.'; else zeige(d.itineraries || []);
    }).catch(function () { el('fehler').textContent = 'Keine Verbindung zum Server.'; }).then(function () { el('los').disabled = !(pt.a && pt.b); });
  }

  api('a=config').catch(function () { return {}; }).then(function (c) {
    karte = L.map('karte').setView(c.center || [51.16, 10.45], c.zoom || 6);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende'}).addTo(karte);
    linien.addTo(karte);
    karte.on('click', function (e) {
      var w = !pt.a ? 'a' : (!pt.b ? 'b' : 'a');
      setze(w, {lat: +e.latlng.lat.toFixed(5), lon: +e.latlng.lng.toFixed(5)}, 'Punkt auf der Karte');
    });
  });
  vorschlaege('a'); vorschlaege('b'); el('los').addEventListener('click', berechnen);
})();
</script>
</body>
</html>
